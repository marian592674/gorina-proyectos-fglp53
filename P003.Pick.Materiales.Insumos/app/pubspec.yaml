name: gorina_pick
description: App de picking de materiales con codigos QR para Frigorifico Gorina.
publish_to: 'none'
version: 1.5.1+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.4.0
  crypto: ^3.0.5
  path: ^1.9.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  share_plus: ^13.3.0
  file_picker: ^12.1.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
